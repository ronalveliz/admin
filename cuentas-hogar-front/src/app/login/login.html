<div class="container0">
  <div class="container" [class.right-panel-active]="isRegister()">

    <!-- LOGIN -->
    <div class="form-container login-container">
      <form class="form-lg" [formGroup]="loginForm" (ngSubmit)="save()">
        <h1>Inicia sesión aquí</h1>

        <div class="form-control2">
          <input type="email" class="email-2" placeholder="Correo electrónico" formControlName="email" />
          <span></span>
        </div>

        <div class="form-control2">
          <input type="password" class="password-2" placeholder="Contraseña" formControlName="password" />
          <span></span>
        </div>

        <div class="content">
          <div class="checkbox">
            <input type="checkbox" name="checkbox" id="checkbox" />
            <label for="checkbox">Recuérdame</label>
          </div>
          <div class="pass-link">
            <a href="#">¿Olvidaste la contraseña?</a>
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid">
          Iniciar sesión
        </button>

        <span>O usa tu cuenta</span>
        <div class="social-container">
          <a href="#" class="social"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="social"><i class="fa-brands fa-google"></i></a>
          <a href="#" class="social"><i class="fa-brands fa-tiktok"></i></a>
        </div>
      </form>
    </div>

    <!-- REGISTRO -->
    <app-usuarios-form></app-usuarios-form>

    <!-- OVERLAY -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1 class="title">
            Hola <br>
            amigos
          </h1>
          <p>
            Si tienes una cuenta, inicia sesión aquí y diviértete
          </p>
          <button type="button" class="ghost" (click)="mostrarLogin()">
            Iniciar sesión
          </button>
        </div>

        <div class="overlay-panel overlay-right">
          <h1 class="title">
            Comienza tu <br>
            viaje ahora
          </h1>
          <p>
            Si aún no tienes una cuenta, únete a nosotros
          </p>
          <button type="button" class="ghost" (click)="mostrarRegistro()">
            Por favor, Regístrate
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
